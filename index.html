const catOf = (c) => c.categoria || (c.tipo === "moto" ? "moto" : ["lancha","nautica","nautico","moto de agua"].includes(c.tipo) ? "nautica" : "auto");
const uso = (c) => c.horas != null && c.km == null ? nf(c.horas) + " hs" : c.km != null ? nf(c.km) + " km" : "";
const RANGOS = [["","Cualquier precio"],["0-10000","Hasta US$10.000"],["10000-20000","US$10.000 a 20.000"],["20000-30000","US$20.000 a 30.000"],["30000-1e12","Más de US$30.000"]];
const veh = (c) => c.mensaje || ((c.genero === "f" ? "la " : "el ") + c.titulo + (c.anio ? " " + c.anio : ""));
const waLink = (num, c) => `https://wa.me/${num}?text=` + encodeURIComponent((REF ? `¡Hola! ${refName()} me pasó el catálogo y me interesó ${veh(c)}. ¿Podrías darme más información?` : `¡Hola! Vi ${veh(c)} en el catálogo. ¿Me podrías dar más info?`).replace(/\s+/g," "));
const pronto = (c) => !(c.fotos || []).length;
const price = (c) => pronto(c) ? `<div class="price prox">Próximamente</div>` : DATA.mostrarPrecio && c.precio ? `<div class="price">${c.moneda === "ARS" ? "$" : "US$"} ${nf(c.precio)}</div>` : "";
const hashOf = (c) => (REF ? REF + "-" : "") + "auto-" + String(c.id).replace(/[^a-zA-Z0-9-]/g, "-");

function slidesHTML(c, big){
  const f = c.fotos || [];
  const imgs = f.length ? f.map((src, i) => big
    ? `<div class="sl" data-i="${i}"><img class="bg" src="${esc(src)}" alt="" aria-hidden="true" loading="${i ? "lazy" : "eager"}" draggable="false"><img class="fg" src="${esc(src)}" alt="${esc(c.titulo)} — foto ${i+1}" loading="${i ? "lazy" : "eager"}" draggable="false"></div>`
    : `<img src="${esc(src)}" alt="${esc(c.titulo)} — foto ${i+1}" loading="${i ? "lazy" : "eager"}" draggable="false">`).join("") : `<div class="ph prox"><span>Próximamente</span></div>`;
  return `<div class="cw ${big ? "" : "card-arrows"}"><div class="slides" data-slides${big && f.length ? " data-zoom" : ""}>${imgs}</div>
    ${f.length > 1 ? `<button class="arrow prev" data-step="-1" aria-label="Foto anterior">‹</button><button class="arrow next" data-step="1" aria-label="Foto siguiente">›</button><div class="dots">${f.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div><span class="count">1 / ${f.length}</span>` : ""}
    ${c.estado === "reservado" ? `<span class="tag">Reservado</span>` : ""}</div>`;
}
function wire(root){
  root.querySelectorAll("[data-slides]").forEach((s) => {
    const cw = s.parentElement, dots = [...cw.querySelectorAll(".dots i")], count = cw.querySelector(".count"), n = s.children.length;
    const idx = () => Math.round(s.scrollLeft / Math.max(1, s.clientWidth));
    s.addEventListener("scroll", () => { const i = idx(); dots.forEach((d, k) => d.classList.toggle("on", k === i)); if (count) count.textContent = `${i+1} / ${n}`; const th = document.querySelectorAll(".thumbs button"); if (cw.closest(".dgal")) th.forEach((b, k) => b.classList.toggle("on", k === i)); }, {passive:true});
    cw.querySelectorAll("[data-step]").forEach((b) => b.addEventListener("click", (e) => { e.stopPropagation(); const i = Math.max(0, Math.min(n-1, idx() + Number(b.dataset.step))); s.scrollTo({left: i * s.clientWidth, behavior: "smooth"}); }));
  });
}
function renderList(){
  const usd = (c) => c.moneda === "ARS" ? c.precio / (DATA.dolar || 1555) : c.precio;
  const [rMin, rMax] = rango ? rango.split("-").map(Number) : [0, Infinity];
  let autos = (DATA.autos || []).map((c, k) => ({c, k})).filter(({c}) => (filter === "todos" || catOf(c) === filter) && (!sub || c.tipo === sub) && (!rango || (c.precio && usd(c) >= rMin && usd(c) <= rMax)));
  autos.reverse();
  if (orden === "anio") autos.sort((a, b) => (b.c.anio || 0) - (a.c.anio || 0));
  if (orden === "barato" || orden === "caro") autos.sort((a, b) => (pronto(a.c) - pronto(b.c)) || (orden === "barato" ? usd(a.c) - usd(b.c) : usd(b.c) - usd(a.c)));
  autos = autos.map(({c}) => c);
  $("grid").innerHTML = autos.length ? autos.map((c, i) => `
    <article class="car" style="--i:${i}">
      <div class="open" data-open="${esc(hashOf(c))}">${slidesHTML(c, false)}</div>
      <div class="body open" data-open="${esc(hashOf(c))}">
        <h2>${esc(c.titulo)}</h2>
        ${c.version ? `<div class="ver">${esc(c.version)}</div>` : ""}
        <div class="meta">${c.anio ? `<span>${esc(c.anio)}</span>` : ""}${uso(c) ? `<span>${uso(c)}</span>` : ""}</div>
        ${price(c)}
        ${(c.ficha||[]).length && !pronto(c) ? `<ul class="ficha">${c.ficha.map((l) => `<li>${esc(l)}</li>`).join("")}</ul>` : ""}
        <span class="more">Ver detalle</span>
      </div>
      <div class="body" style="padding-top:0;flex:0"><a class="wa" href="${esc(waLink(DATA.whatsapp, c))}" target="_blank" rel="noopener">${WA_ICON}Consultar por WhatsApp</a></div>
    </article>`).join("") : (DATA.autos||[]).length ? `<p class="empty">No hay unidades con ese filtro.</p>` : `<p class="empty">Pronto vas a ver los vehículos disponibles acá.</p>`;
  const n = autos.length; $("sep").innerHTML = n ? `<b>${n}</b>&nbsp;${n === 1 ? "unidad disponible" : "unidades disponibles"}` : ""; $("sep").hidden = !n;
  wire($("grid"));
}
function renderOne(c){
  const f = c.fotos || [];
  const specs = (c.detalle && c.detalle.length ? c.detalle : (c.ficha || []).map((l) => ({k:"", v:l})));
  $("one").innerHTML = `<button class="back" id="back">← Volver al catálogo</button>
    <div class="detail">
      <div class="dgal">${slidesHTML(c, true)}${f.length > 1 ? `<div class="thumbs">${f.map((src, i) => `<button data-th="${i}" class="${i ? "" : "on"}" aria-label="Ver foto ${i+1}"><img src="${esc(src)}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}</div>
      <aside class="info">
        <div><h2>${esc(c.titulo)}</h2>${c.version ? `<div class="ver" style="margin-top:4px">${esc(c.version)}</div>` : ""}</div>
        <div class="meta">${c.anio ? `<span>${esc(c.anio)}</span>` : ""}${uso(c) ? `<span>${uso(c)}</span>` : ""}${c.estado === "reservado" ? `<span>Reservado</span>` : ""}</div>
        ${price(c)}
        ${c.descripcion && !pronto(c) ? `<p class="desc">${esc(c.descripcion)}</p>` : ""}
        ${specs.length && !pronto(c) ? `<div><h3>Ficha técnica</h3><dl class="specs" style="margin-top:10px">${specs.map((s) => s.k ? `<dt>${esc(s.k)}</dt><dd>${esc(s.v)}</dd>` : `<dt>·</dt><dd>${esc(s.v)}</dd>`).join("")}</dl></div>` : ""}
        <div class="loc">📍 Luján, Provincia de Buenos Aires</div>
        <a class="wa" href="${esc(waLink(DATA.whatsapp, c))}" target="_blank" rel="noopener">${WA_ICON}Consultar por WhatsApp</a>
      </aside>
    </div>`;
  wire($("one"));
  const zs = $("one").querySelector("[data-zoom]");
  if (zs) zs.addEventListener("click", () => openLB(f, Math.round(zs.scrollLeft / Math.max(1, zs.clientWidth))));
  $("one").querySelectorAll("[data-th]").forEach((b) => b.addEventListener("click", () => { const s = $("one").querySelector("[data-slides]"); s.scrollTo({left: Number(b.dataset.th) * s.clientWidth, behavior: "smooth"}); }));
  $("back").addEventListener("click", () => { location.hash = REF; route(); });
}

/* ---------- visor a pantalla completa con zoom ---------- */
let LB = {fotos:[], i:0};
const lbS = () => $("lbs");
function lbIdx(){ const s = lbS(); return Math.round(s.scrollLeft / Math.max(1, s.clientWidth)); }
function lbCount(){ const k = lbIdx(); $("lbc").textContent = `${k+1} / ${LB.fotos.length}`;
  const bg = $("lbbg"), src = LB.fotos[k]; if (src && bg.getAttribute("src") !== src) bg.src = src;
  $("lbt").querySelectorAll("button").forEach((b, j) => { b.classList.toggle("on", j === k); if (j === k) b.scrollIntoView({block:"nearest", inline:"nearest"}); }); }
function fit(z, img){ const cw = z.clientWidth, ch = z.clientHeight, ar = (img.naturalWidth || 4) / (img.naturalHeight || 3); const w = Math.min(cw, ch * ar); return {w, h: w / ar, cw, ch}; }
function setZoom(z, sc, cx, cy){
  const img = z.querySelector("img"); sc = Math.max(1, Math.min(5, sc));
  if (sc <= 1.01){ z.dataset.s = 1; z.classList.remove("on"); img.style.width = img.style.height = ""; $("lb").classList.toggle("zoomed", false); return; }
  const prev = Number(z.dataset.s || 1), F = fit(z, img), rect = z.getBoundingClientRect();
  cx = cx ?? rect.left + F.cw/2; cy = cy ?? rect.top + F.ch/2;
  const r = prev > 1 ? img.getBoundingClientRect() : {left: rect.left + (F.cw - F.w)/2, top: rect.top + (F.ch - F.h)/2, width: F.w, height: F.h};
  const rx = Math.max(0, Math.min(1, (cx - r.left) / r.width)), ry = Math.max(0, Math.min(1, (cy - r.top) / r.height));
  z.dataset.s = sc; z.classList.add("on"); $("lb").classList.add("zoomed");
  img.style.width = F.w * sc + "px"; img.style.height = F.h * sc + "px";
  const nw = F.w * sc, nh = F.h * sc;
  z.scrollLeft = rx * nw - (cx - rect.left); z.scrollTop = ry * nh - (cy - rect.top);
}
function resetAll(){ lbS().querySelectorAll(".z").forEach((z) => setZoom(z, 1)); }
function openLB(fotos, i){
  LB = {fotos, i}; const s = lbS();
  s.innerHTML = fotos.map((src, k) => `<div class="z" data-s="1"><img src="${esc(src)}" alt="Foto ${k+1}" draggable="false"></div>`).join("");
  $("lbt").innerHTML = fotos.length > 1 ? fotos.map((src, k) => `<button data-lt="${k}" aria-label="Ver foto ${k+1}"><img src="${esc(src)}" alt="" loading="lazy"></button>`).join("") : "";
  $("lbt").hidden = fotos.length < 2;
  $("lbt").querySelectorAll("[data-lt]").forEach((b) => b.addEventListener("click", () => { resetAll(); s.scrollTo({left: Number(b.dataset.lt) * s.clientWidth}); }));
  $("lb").hidden = false; document.body.style.overflow = "hidden";
  requestAnimationFrame(() => { s.scrollLeft = i * s.clientWidth; lbCount(); });
  const multi = fotos.length > 1; $("lbp").hidden = $("lbn").hidden = !multi;
  s.querySelectorAll(".z").forEach((z) => {
    let last = 0, pinch = null, pan = null;
    z.addEventListener("click", (e) => { const now = Date.now(); if (matchMedia("(hover:hover)").matches){ setZoom(z, Number(z.dataset.s) > 1 ? 1 : 2.5, e.clientX, e.clientY); return; } if (now - last < 300){ setZoom(z, Number(z.dataset.s) > 1 ? 1 : 2.5, e.clientX, e.clientY); last = 0; } else last = now; });
    z.addEventListener("touchstart", (e) => { if (e.touches.length === 2){ const [a,b] = e.touches; pinch = {d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), s: Number(z.dataset.s||1)}; } else if (e.touches.length === 1 && Number(z.dataset.s) > 1){ pan = {x:e.touches[0].clientX, y:e.touches[0].clientY, l:z.scrollLeft, t:z.scrollTop}; } }, {passive:true});
    z.addEventListener("touchmove", (e) => {
      if (pinch && e.touches.length === 2){ e.preventDefault(); const [a,b] = e.touches; const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY); setZoom(z, pinch.s * d / pinch.d, (a.clientX+b.clientX)/2, (a.clientY+b.clientY)/2); }
      else if (pan && e.touches.length === 1){ e.preventDefault(); z.scrollLeft = pan.l - (e.touches[0].clientX - pan.x); z.scrollTop = pan.t - (e.touches[0].clientY - pan.y); }
    }, {passive:false});
    z.addEventListener("touchend", (e) => { if (e.touches.length < 2) pinch = null; if (!e.touches.length) pan = null; });
    z.addEventListener("wheel", (e) => { if (!e.ctrlKey && Number(z.dataset.s) <= 1) return; if (e.ctrlKey){ e.preventDefault(); setZoom(z, Number(z.dataset.s||1) * (e.deltaY < 0 ? 1.15 : 1/1.15), e.clientX, e.clientY); } }, {passive:false});
  });
  s.onscroll = () => { const k = lbIdx(); if (k !== LB.i){ LB.i = k; resetAll(); } lbCount(); };
}
function closeLB(){ resetAll(); $("lb").hidden = true; document.body.style.overflow = ""; const g = $("one").querySelector("[data-zoom]"); if (g) g.scrollTo({left: LB.i * g.clientWidth}); }
function stepLB(d){ resetAll(); const s = lbS(); const k = Math.max(0, Math.min(LB.fotos.length-1, lbIdx() + d)); s.scrollTo({left: k * s.clientWidth, behavior:"smooth"}); }
$("lbx").addEventListener("click", closeLB);
$("lbp").addEventListener("click", () => stepLB(-1));
$("lbn").addEventListener("click", () => stepLB(1));
addEventListener("keydown", (e) => { if ($("lb").hidden) return; if (e.key === "Escape") closeLB(); if (e.key === "ArrowLeft") stepLB(-1); if (e.key === "ArrowRight") stepLB(1); });
addEventListener("resize", () => { if (!$("lb").hidden){ resetAll(); lbS().scrollLeft = LB.i * lbS().clientWidth; } });
function bar(){
  const O = [["barato","Menor precio"],["caro","Mayor precio"],["anio","Más nuevos"]];
  $("sort").innerHTML = `<span>Ordenar:</span>` + O.map(([k, t]) => `<button data-o="${k}" aria-pressed="${k===orden}">${t}</button>`).join("") + `<select id="rango" aria-label="Filtrar por precio">${RANGOS.map(([v, t]) => `<option value="${v}"${v===rango?" selected":""}>${t}</option>`).join("")}</select>`; $("sort").hidden = false;
  const L = {todos:"Todos", auto:"Autos", moto:"Motos", nautica:"Náutica"};
  $("bar").innerHTML = ["auto","moto","nautica"].map((t) => `<button data-f="${t}" aria-pressed="${t===filter}">${L[t]}</button>`).join(""); $("bar").hidden = false;
  const S = [["","Todos los autos"],["sedan","Sedán"],["suv","SUV"],["pickup","Pickup"],["hatchback","Hatchback"]];
  $("sub").innerHTML = filter === "auto" ? S.map(([t, l]) => `<button data-sub="${t}" aria-pressed="${t===sub}">${l}</button>`).join("") : ""; $("sub").hidden = filter !== "auto";
}
function route(){
  if (!DATA) return;
  if (!$("lb").hidden) closeLB();
  const raw = location.hash.slice(1); const h = readRef(raw) ? raw : ""; const c = h && DATA.autos.find((x) => hashOf(x) === h || (REF && hashOf(x) === REF + "-" + h));
  if (REF) $("fwa").href = "https://wa.me/5491154854749?text=" + encodeURIComponent(`¡Hola! ${refName()} me pasó el catálogo. ¿Podrías darme más información?`);
  document.body.classList.toggle("is-one", !!c);
  if (c){ $("list").hidden = true; $("one").hidden = false; renderOne(c); window.scrollTo(0, 0); }
  else { $("one").hidden = true; $("list").hidden = false; }
}
document.addEventListener("click", (e) => {
  const f = e.target.closest("[data-f]"); if (f){ filter = f.dataset.f; sub = ""; bar(); renderList(); return; }
  const sb = e.target.closest("[data-sub]"); if (sb){ sub = sb.dataset.sub; bar(); renderList(); return; }
  const ob = e.target.closest("[data-o]"); if (ob){ orden = orden === ob.dataset.o ? "" : ob.dataset.o; bar(); renderList(); return; }
  if (e.target.closest(".arrow") || e.target.closest(".wa")) return;
  const o = e.target.closest("[data-open]"); if (o){ location.hash = o.dataset.open; route(); }
});
addEventListener("hashchange", route);
document.addEventListener("change", (e) => { if (e.target.id === "rango"){ rango = e.target.value; renderList(); } });
$("fwa").insertAdjacentHTML("afterbegin", WA_ICON);
fetch("catalogo.json", {cache:"no-store"}).then((r) => r.json()).then((d) => {
  DATA = d; bar(); renderList(); route();
  if (d.actualizado){ const t = new Date(d.actualizado); $("upd").textContent = "Actualizado el " + t.toLocaleDateString("es-AR",{day:"numeric",month:"long",timeZone:"America/Argentina/Buenos_Aires"}); }
}).catch(() => { $("grid").innerHTML = `<p class="empty">No se pudo cargar el catálogo. Probá recargar la página.</p>`; });
})();
</script>

</body></html>
